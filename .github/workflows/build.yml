
name: OMKAR MUSIC APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --console=plain 2>&1 | tee build-log.txt; grep -n -i -E "error:|e: |failed" build-log.txt | tail -40; exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMKAR-MUSIC-APK
          path: app/build/outputs/apk/debug/*.apk
          
